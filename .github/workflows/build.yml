name: Build CosmoVedic Flutter APK, AAB & iOS Package

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build_android:
    name: Build Android APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Repair Android Scaffolding in CI
        run: |
          flutter config --no-analytics
          flutter create --platforms=android .

      - name: Install dependencies
        run: flutter pub get

      - name: Verify Flutter setup
        run: flutter doctor -v

      - name: Build Release APK (for phone testing)
        run: flutter build apk --release --no-tree-shake-icons

      - name: Build Release AAB (for Play Store)
        run: flutter build appbundle --release --no-tree-shake-icons

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CosmoVedic-APK-v1.0.1
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: CosmoVedic-AAB-v1.0.1-PlayStore
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  build_ios:
    name: Build iOS Package (macOS Runner)
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Repair iOS Scaffolding in CI
        run: |
          flutter config --no-analytics
          flutter create --platforms=ios .

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release iOS App (No Codesign for Testing Package)
        run: flutter build ios --release --no-codesign --no-tree-shake-icons

      - name: Create iOS Payload IPA Package
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r CosmoVedic-iOS-v1.0.1.ipa Payload

      - name: Upload iOS Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CosmoVedic-iOS-v1.0.1
          path: build/ios/iphoneos/CosmoVedic-iOS-v1.0.1.ipa
          retention-days: 30
