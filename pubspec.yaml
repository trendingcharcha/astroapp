name: cosmovedic
description: CosmoVedic - Premium Vedic Astrology App (Horocosmo Replica)
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Offline Storage / Cache
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Firebase Backend
  firebase_core: ^3.2.0
  firebase_auth: ^5.1.1
  cloud_firestore: ^5.0.2

  # Auth Helper
  google_sign_in: ^6.2.1

  # Supabase Backend
  supabase_flutter: ^2.6.0

  # UI / Animations / Icons
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2
  google_fonts: ^6.2.1
  font_awesome_flutter: ^10.7.0
  cupertino_icons: ^1.0.8

  # Helpers / Utils
  intl: ^0.19.0
  path_provider: ^2.1.3
  share_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.9
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
